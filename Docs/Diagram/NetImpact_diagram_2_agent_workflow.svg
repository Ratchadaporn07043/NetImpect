<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, 'Segoe UI', sans-serif" role="img">
  <title>NetImpact — รายละเอียดทีม AI: Planner → Worker → Reviewer</title>
  <desc>Planner ส่งแผนให้ Worker ทำงาน แล้ว Reviewer ตรวจ ถ้า REVISE จะย้อนกลับไปที่ Worker แก้ใหม่ ถ้า APPROVED จะจบทันที คำตอบสุดท้ายถูกส่งไปให้ Ground-Truth Evaluator ตรวจซ้ำอย่างอิสระ ทั้งชุดมี retry สูงสุด 2 ครั้งเมื่อเจอ timeout หรือ connection error</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">NetImpact — รายละเอียดทีม AI (Planner → Worker → Reviewer)</text>

  <!-- retry wrapper dashed box -->
  <rect x="50" y="66" width="860" height="330" rx="10" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="130" y="56" width="700" height="22" fill="#ffffff"/>
  <text x="480" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Retry wrapper: สูงสุด 2 ครั้ง (MAX_RETRIES) เมื่อ timeout / connection error</text>

  <!-- round cap note -->
  <text x="480" y="112" text-anchor="middle" font-size="11" font-style="italic" fill="#7a5a1a">สูงสุด 6 รอบสนทนา (MAX_ROUNDS) — กันไม่ให้วนไม่จบ</text>

  <!-- Planner -->
  <rect x="90" y="140" width="220" height="100" rx="8" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="2"/>
  <text x="200" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4d2c">Planner</text>
  <text x="200" y="195" text-anchor="middle" font-size="11.5" fill="#1d4d2c">วางแผน 3–5 ข้อ</text>
  <text x="200" y="212" text-anchor="middle" font-size="11.5" fill="#1d4d2c">ห้ามลงมือทำเอง</text>

  <line x1="310" y1="190" x2="344" y2="190" stroke="#444" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Worker -->
  <rect x="350" y="140" width="220" height="100" rx="8" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="2"/>
  <text x="460" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4d2c">Worker</text>
  <text x="460" y="195" text-anchor="middle" font-size="11.5" fill="#1d4d2c">ลงมือทำจริง</text>
  <text x="460" y="212" text-anchor="middle" font-size="11.5" fill="#1d4d2c">แก้ตามที่ Reviewer ติง</text>

  <line x1="570" y1="190" x2="604" y2="190" stroke="#444" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Reviewer -->
  <rect x="610" y="140" width="220" height="100" rx="8" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="2"/>
  <text x="720" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4d2c">Reviewer</text>
  <text x="720" y="195" text-anchor="middle" font-size="11.5" fill="#1d4d2c">APPROVED / REVISE</text>
  <text x="720" y="212" text-anchor="middle" font-size="11.5" fill="#1d4d2c">+ SCORE 1–5</text>

  <!-- REVISE loop back to Worker -->
  <path d="M 780,140 C 740,95 540,95 500,140" fill="none" stroke="#c9820a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="640" y="98" text-anchor="middle" font-size="11" fill="#8a6a2a">REVISE → กลับไปแก้ (rejection++)</text>

  <!-- APPROVED exit down -->
  <line x1="720" y1="240" x2="720" y2="284" stroke="#2f8f4e" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="800" y="266" text-anchor="middle" font-size="11" fill="#1d4d2c">APPROVED</text>
  <text x="800" y="280" text-anchor="middle" font-size="11" fill="#1d4d2c">→ จบทันที</text>

  <!-- final answer box -->
  <rect x="610" y="290" width="220" height="70" rx="8" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="720" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4d2c">final_answer</text>
  <text x="720" y="336" text-anchor="middle" font-size="10.5" fill="#1d4d2c">(ข้อความล่าสุดของ Worker)</text>

  <!-- retry whole attempt arrow along bottom of dashed box -->
  <path d="M 880,240 C 940,300 940,340 200,340 C 140,340 120,300 150,244" fill="none" stroke="#b03030" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow2)"/>
  <text x="530" y="360" text-anchor="middle" font-size="11" fill="#8a2a2a">error/timeout → retry ทั้ง Planner→Worker→Reviewer ใหม่ทั้งชุด (agent ชุดใหม่ทุกครั้ง)</text>

  <!-- Ground truth evaluator (outside dashed box, independent) -->
  <line x1="830" y1="325" x2="924" y2="220" stroke="#444" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="930" y="140" width="220" height="200" rx="8" fill="#f1eafc" stroke="#7a4fc4" stroke-width="2"/>
  <text x="1040" y="168" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#402a6b">Ground-Truth</text>
  <text x="1040" y="186" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#402a6b">Evaluator</text>
  <text x="1040" y="212" text-anchor="middle" font-size="11" fill="#402a6b">อิสระจากทีม ไม่ช่วยแก้งาน</text>
  <text x="1040" y="230" text-anchor="middle" font-size="11" fill="#402a6b">เทียบกับ rubric ที่ตั้งไว้</text>
  <text x="1040" y="248" text-anchor="middle" font-size="11" fill="#402a6b">ล่วงหน้า (TASK_GROUND_TRUTH)</text>
  <text x="1040" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#402a6b">→ ground_truth_score</text>
  <text x="1040" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#402a6b">→ ground_truth_passed</text>
  <text x="1040" y="316" text-anchor="middle" font-size="10" font-style="italic" fill="#6a4a9a">โหมด: heuristic / llm / both</text>

  <!-- bottom note -->
  <rect x="90" y="420" width="1020" height="60" rx="8" fill="#fdf1de" stroke="#c9820a" stroke-width="1.6"/>
  <text x="600" y="444" text-anchor="middle" font-size="12" fill="#6b4a05">ทำไมต้องมี Ground-Truth Evaluator แยกจาก Reviewer? — เพราะ Reviewer เองก็สื่อสารผ่านเครือข่ายที่มีปัญหาเหมือนกัน</text>
  <text x="600" y="462" text-anchor="middle" font-size="12" fill="#6b4a05">อาจตัดสินใจพลาด (ให้ผ่านทั้งที่งานไม่ดีจริง) — ต้องมีผู้ตรวจอิสระมาเช็กซ้ำ (ดูข้อค้นพบข้อ 3 ในเอกสาร)</text>

  <!-- legend -->
  <rect x="90" y="500" width="18" height="14" fill="#eaf7ee" stroke="#2f8f4e"/>
  <text x="114" y="512" font-size="11" fill="#333">Agent ในทีม (System Layer)</text>
  <rect x="300" y="500" width="18" height="14" fill="#f1eafc" stroke="#7a4fc4"/>
  <text x="324" y="512" font-size="11" fill="#333">ผู้ตรวจสอบอิสระ (Ground-Truth)</text>
  <rect x="560" y="500" width="18" height="14" fill="#fdf1de" stroke="#c9820a"/>
  <text x="584" y="512" font-size="11" fill="#333">หมายเหตุ/คำอธิบายเสริม</text>
</svg>
