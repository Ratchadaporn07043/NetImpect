<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, 'Segoe UI', sans-serif" role="img">
  <title>NetImpact — เส้นทางวิเคราะห์ผลหลังรันเสร็จ</title>
  <desc>ไฟล์ JSON log 1544 ไฟล์ถูกอ่านโดยสคริปต์ 3 ตัว วิเคราะห์ pilot readiness สร้าง threshold guideline และประเมิน ground truth ซ้ำ แล้วสรุปเป็นไฟล์ CSV และตาราง threshold นำไปสู่ deployment guideline</desc>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">NetImpact — เส้นทางวิเคราะห์ผลหลังรันเสร็จ</text>

  <rect x="440" y="60" width="320" height="70" rx="8" fill="#fdeaec" stroke="#c2415a" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b1f2c">1,544 ไฟล์ JSON log</text>
  <text x="600" y="108" text-anchor="middle" font-size="11" fill="#6b1f2c">(logs_three_day/)</text>

  <line x1="600" y1="130" x2="600" y2="164" stroke="#444" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="600" y1="150" x2="200" y2="180" stroke="#444" stroke-width="1.6"/>
  <line x1="600" y1="150" x2="1000" y2="180" stroke="#444" stroke-width="1.6"/>

  <!-- 3 script boxes -->
  <rect x="60" y="186" width="300" height="110" rx="8" fill="#f1f1f3" stroke="#6b6f76" stroke-width="2"/>
  <text x="210" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">analyze_pilot.py</text>
  <text x="210" y="234" text-anchor="middle" font-size="11" fill="#333333">เช็ค variance / crash /</text>
  <text x="210" y="250" text-anchor="middle" font-size="11" fill="#333333">timing ก่อนรันเต็ม</text>
  <text x="210" y="272" text-anchor="middle" font-size="10" font-style="italic" fill="#555">ใช้ตอน pilot เท่านั้น</text>

  <rect x="450" y="186" width="300" height="110" rx="8" fill="#f1f1f3" stroke="#6b6f76" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">analyze_guidelines.py</text>
  <text x="600" y="234" text-anchor="middle" font-size="11" fill="#333333">สร้าง threshold</text>
  <text x="600" y="250" text-anchor="middle" font-size="11" fill="#333333">safe / warning / failure</text>
  <text x="600" y="272" text-anchor="middle" font-size="10" font-style="italic" fill="#555">ใช้กับ three-day/full run</text>

  <rect x="840" y="186" width="300" height="110" rx="8" fill="#f1f1f3" stroke="#6b6f76" stroke-width="2"/>
  <text x="990" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">evaluate_logs.py</text>
  <text x="990" y="234" text-anchor="middle" font-size="11" fill="#333333">ประเมิน ground-truth ซ้ำ</text>
  <text x="990" y="250" text-anchor="middle" font-size="11" fill="#333333">ด้วย LLM judge (post-hoc)</text>
  <text x="990" y="272" text-anchor="middle" font-size="10" font-style="italic" fill="#555">ทางเลือกเสริม</text>

  <line x1="210" y1="296" x2="560" y2="336" stroke="#444" stroke-width="1.6"/>
  <line x1="600" y1="296" x2="600" y2="336" stroke="#444" stroke-width="1.6"/>
  <line x1="990" y1="296" x2="640" y2="336" stroke="#444" stroke-width="1.6" marker-end="url(#arrow4)"/>

  <rect x="410" y="342" width="380" height="70" rx="8" fill="#e6f7f6" stroke="#17877e" stroke-width="2"/>
  <text x="600" y="368" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0b433d">4 ไฟล์ CSV สรุปผล</text>
  <text x="600" y="388" text-anchor="middle" font-size="11" fill="#0b433d">phase / task / main_effect / combined</text>

  <line x1="600" y1="412" x2="600" y2="446" stroke="#444" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="370" y="452" width="460" height="90" rx="8" fill="#fdf1de" stroke="#c9820a" stroke-width="2"/>
  <text x="600" y="480" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6b4a05">ตาราง Threshold</text>
  <text x="600" y="500" text-anchor="middle" font-size="11" fill="#6b4a05">Safe / Warning / Failure</text>
  <text x="600" y="518" text-anchor="middle" font-size="11" fill="#6b4a05">แยกตาม delay / packet loss / jitter</text>

  <line x1="600" y1="542" x2="600" y2="576" stroke="#444" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="390" y="582" width="420" height="66" rx="8" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="2"/>
  <text x="600" y="608" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d4d2c">Deployment Guideline</text>
  <text x="600" y="628" text-anchor="middle" font-size="11" fill="#1d4d2c">คำแนะนำเชิงปฏิบัติสำหรับวิศวกรที่จะ deploy จริง</text>
</svg>
