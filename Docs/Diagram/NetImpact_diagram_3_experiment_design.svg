<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, 'Segoe UI', sans-serif" role="img">
  <title>NetImpact — การออกแบบการทดลอง (Three-Day Bounded Design)</title>
  <desc>การทดลองแบ่งเป็น 4 phase คือ Tournament, Main Effect, Combined Sample และ Baseline Extra รวม 1544 trials มีระบบ checkpoint สำหรับ resume เมื่อรันขาดตอน</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="500" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">NetImpact — การออกแบบการทดลอง (Three-Day Bounded Design)</text>

  <!-- 4 phase boxes -->
  <rect x="40" y="70" width="260" height="150" rx="8" fill="#e6f7f6" stroke="#17877e" stroke-width="2"/>
  <text x="170" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b433d">Tournament</text>
  <text x="170" y="122" text-anchor="middle" font-size="11" fill="#0b433d">8 รูปแบบพบกันหมด</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#0b433d">round-robin 28 คู่</text>
  <text x="170" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b433d">224 trials</text>
  <text x="170" y="198" text-anchor="middle" font-size="10" font-style="italic" fill="#2a6a63">1 repeat / คู่</text>

  <rect x="320" y="70" width="260" height="150" rx="8" fill="#e6f7f6" stroke="#17877e" stroke-width="2"/>
  <text x="450" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b433d">Main Effect</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#0b433d">ทดสอบทีละปัจจัย</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#0b433d">ครบทุกระดับ</text>
  <text x="450" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b433d">840 trials</text>
  <text x="450" y="198" text-anchor="middle" font-size="10" font-style="italic" fill="#2a6a63">5 repeats / ระดับ</text>

  <rect x="600" y="70" width="260" height="150" rx="8" fill="#e6f7f6" stroke="#17877e" stroke-width="2"/>
  <text x="730" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b433d">Combined Sample</text>
  <text x="730" y="122" text-anchor="middle" font-size="11" fill="#0b433d">สุ่ม 100 จุด</text>
  <text x="730" y="140" text-anchor="middle" font-size="11" fill="#0b433d">ผสมหลายปัจจัย</text>
  <text x="730" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b433d">400 trials</text>
  <text x="730" y="198" text-anchor="middle" font-size="10" font-style="italic" fill="#2a6a63">1 repeat / จุด</text>

  <rect x="880" y="70" width="260" height="150" rx="8" fill="#e6f7f6" stroke="#17877e" stroke-width="2"/>
  <text x="1010" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b433d">Baseline Extra</text>
  <text x="1010" y="122" text-anchor="middle" font-size="11" fill="#0b433d">ไม่มีปัญหาเครือข่าย</text>
  <text x="1010" y="140" text-anchor="middle" font-size="11" fill="#0b433d">เลย</text>
  <text x="1010" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b433d">80 trials</text>
  <text x="1010" y="198" text-anchor="middle" font-size="10" font-style="italic" fill="#2a6a63">20 repeats</text>

  <!-- converge arrows -->
  <line x1="170" y1="220" x2="560" y2="272" stroke="#444" stroke-width="1.6"/>
  <line x1="450" y1="220" x2="580" y2="272" stroke="#444" stroke-width="1.6"/>
  <line x1="730" y1="220" x2="620" y2="272" stroke="#444" stroke-width="1.6"/>
  <line x1="1010" y1="220" x2="640" y2="272" stroke="#444" stroke-width="1.6" marker-end="url(#arrow3)"/>

  <rect x="460" y="278" width="280" height="64" rx="8" fill="#fdeaec" stroke="#c2415a" stroke-width="2"/>
  <text x="600" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b1f2c">รวม 1,544 trials</text>
  <text x="600" y="324" text-anchor="middle" font-size="11" fill="#6b1f2c">× 4 tasks ต่อ scenario</text>

  <line x1="600" y1="342" x2="600" y2="376" stroke="#444" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="380" y="382" width="440" height="90" rx="8" fill="#f1f1f3" stroke="#6b6f76" stroke-width="2"/>
  <text x="600" y="410" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333333">checkpoint.json</text>
  <text x="600" y="430" text-anchor="middle" font-size="11" fill="#333333">บันทึกว่า trial ไหนเสร็จแล้วบ้าง</text>
  <text x="600" y="448" text-anchor="middle" font-size="11" fill="#333333">รองรับ --resume เมื่อรันขาดตอน (เครื่องดับ/พักเครื่อง)</text>

  <text x="600" y="60" text-anchor="middle" font-size="11" font-style="italic" fill="#555">แต่ละ trial: apply เครือข่าย → รัน Planner/Worker/Reviewer (Diagram 2) → clear เครือข่าย → บันทึก log (Diagram 1)</text>
</svg>
